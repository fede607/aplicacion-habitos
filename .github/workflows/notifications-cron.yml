# Dispara el envío de notificaciones cada hora (gratis con GitHub Actions).
# Configura en GitHub → Settings → Secrets and variables → Actions:
#   APP_URL      https://tu-app.vercel.app
#   CRON_SECRET  el mismo valor que en Vercel
name: Notificaciones por email

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint del cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL o CRON_SECRET sin configurar: no se envía nada."
            exit 0
          fi
          curl --fail-with-body -sS --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/notifications"
