# Configuración para `npx supabase start` (desarrollo local).
project_id = "winter-arc"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
minimum_password_length = 8

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
# En local se confirma automáticamente; en producción activa "Confirm email".
enable_confirmations = false
secure_password_change = true

# CAPTCHA: en producción actívalo en el panel (Auth → Attack Protection).
# Para probarlo en local descomenta y usa las claves de prueba de Cloudflare.
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "1x0000000000000000000000000000000AA"
